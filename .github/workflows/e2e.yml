name: E2E (Playwright)

# Runs the Playwright end-to-end tests on every push and pull request.
# The backend is mocked in the tests, so NO Supabase / Gemini secrets are needed.
on:
  push:
  pull_request:

jobs:
  e2e:
    name: Playwright tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Install the frontend app's deps so Playwright can boot `next dev`.
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Install the isolated e2e project's deps (Playwright).
      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: e2e
        run: npx playwright test

      # Publish the HTML report so failures can be inspected from the Actions run.
      - name: Upload Playwright report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
